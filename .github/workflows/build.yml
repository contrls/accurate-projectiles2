name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build the mod
        run: gradle build

      - name: Check the finished jar
        run: |
          JAR=$(ls build/libs/accurate-projectiles-*.jar | head -n 1)
          echo "Built: $JAR"
          unzip -l "$JAR"
          echo "--- fabric.mod.json inside the jar ---"
          unzip -p "$JAR" fabric.mod.json | tee fabric.mod.json.check
          python3 - <<'PY'
          import json
          deps = json.load(open("fabric.mod.json.check"))["depends"]
          assert deps["minecraft"] == "1.21.1", deps
          assert "fabricloader" in deps, deps
          print("OK: depends on Minecraft", deps["minecraft"], "and Fabric Loader", deps["fabricloader"])
          PY
          if unzip -l "$JAR" | grep -q "refmap.json"; then
            echo "OK: mixin refmap is present"
          else
            echo "::warning::No mixin refmap found in the jar; the mixins may not work outside a dev environment."
          fi

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: accurate-projectiles-jar
          path: build/libs/accurate-projectiles-*.jar
          if-no-files-found: error
